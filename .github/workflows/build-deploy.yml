name: Build and Deploy
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: "ubuntu-latest"
    environment: "Production"
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 2
      ALGORITHM: HS256
      REDIS_URL: redis://localhost:6379/2
      TEST_REDIS_URL: redis://localhost:6379/3
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"  
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          pytest
    services:
      redis:
        image: redis  # starts a Redis container for the tests
        ports:
          - 6379:6379  # same door as on my localhost
        # before the steps start, so tests don't run against a Redis that isn't ready
        options: >-  #makes GitHub wait until Redis answers a ping
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
           